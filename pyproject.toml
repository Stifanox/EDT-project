[project]
name = "edt"
version = "0.1.0"
description = "Baza dokumentów z wyszukiwaniem (keyword / TF-IDF / semantyczne) i NER"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: wymaga ciężkich modeli (spaCy / sentence-transformers); pomiń: pytest -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
